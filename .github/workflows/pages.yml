# Публікація центру допомоги (папка site/) на GitHub Pages.
# НА ПАУЗІ (рішення 18.11.2026): доступ для сторонніх поки не відкриваємо.
# Автозапуск при push вимкнено; запуск лише вручну (Actions → Run workflow), коли буде рішення про хостинг.
# Щоб увімкнути автопублікацію знову, поверніть блок:
#   push:
#     branches: [master]
name: Deploy help center to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
